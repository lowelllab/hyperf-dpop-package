# HAProxy 3.2. Set all three variables before starting the gateway.
# Keep the backend on loopback or a network reachable only by this gateway.
global
    maxconn 2048

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend dpop_https
    bind "${DPOP_GATEWAY_BIND}" ssl crt "${DPOP_GATEWAY_CERT}" ssl-min-ver TLSv1.2 alpn h2,http/1.1
    # Count full fields BEFORE any header normalization or forwarding.
    http-request return status 400 content-type application/json string '{"error":"invalid_request"}' hdr Cache-Control no-store if { req.fhdr_cnt(authorization) gt 1 } || { req.fhdr_cnt(dpop) gt 1 }
    # Neither authentication field permits comma-separated value lists.
    http-request return status 400 content-type application/json string '{"error":"invalid_request"}' hdr Cache-Control no-store if { req.fhdr(authorization) -m sub , } || { req.fhdr(dpop) -m sub , }
    # Authentication fields may never be supplied as trailers.
    http-request return status 400 content-type application/json string '{"error":"invalid_request"}' hdr Cache-Control no-store if { req.hdr(trailer) -m str -i authorization dpop }
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request set-header X-Real-IP %[src]
    default_backend hyperf_dpop

backend hyperf_dpop
    # Also discard undeclared HTTP/1 and HTTP/2 trailers before Swoole can
    # merge them into the initial header map. Request body bytes are retained.
    option http-drop-request-trailers
    # External clients can use HTTP/2; Swoole receives HTTP/1.1 only.
    server hyperf "${DPOP_BACKEND_ADDR}" proto h1
